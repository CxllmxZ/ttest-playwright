name: Start-TestCase

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Format - project/testcase or project/'
        required: true
        type: string
        default: 'nebula-spa/smoke'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Determine test path
        id: path
        run: |
          INPUT="${{ inputs.test }}"
          if [[ "$INPUT" == */ ]]; then
            TEST_PATH="Test-Prod/$INPUT"
            echo "Mode - folder"
          else
            TEST_PATH="Test-Prod/${INPUT}.spec.ts"
            echo "Mode - specific file"
          fi
          echo "path=$TEST_PATH" >> $GITHUB_OUTPUT
          echo "Selected - $TEST_PATH"

      - name: Validate path exists
        run: |
          TARGET="${{ steps.path.outputs.path }}"
          if [ ! -e "$TARGET" ]; then
            echo "Not found - $TARGET"
            echo ""
            echo "Available projects:"
            ls -d Test-Prod/*/ 2>/dev/null | sed 's|Test-Prod/|  - |'
            echo ""
            echo "Available tests:"
            find Test-Prod -name "*.spec.ts" 2>/dev/null | sed 's|Test-Prod/||' | sed 's|.spec.ts||' | sed 's|^|  - |'
            exit 1
          fi

      - name: Run Playwright tests
        id: run-test
        run: pnpm exec playwright test ${{ steps.path.outputs.path }}
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./playwright-report

      - name: Fail if test failed
        if: steps.run-test.outcome == 'failure'
        run: exit 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4