name: Build ttest

on:
  workflow_dispatch:

# Permissions ที่ต้องมีสำหรับ deploy Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ป้องกัน concurrent deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build ttest
        run: pnpm build

      - name: Run Nebula smoke test
        id: run-test
        run: node dist/cli.js run project-testcase/nebula-spa/smoke.yaml
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./report

      - name: Fail workflow if test failed
        if: steps.run-test.outcome == 'failure'
        run: |
          echo "❌ Test failed - see report for details"
          exit 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4