name: Build ttest

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Which project to test'
        required: true
        type: choice
        options:
          - nebula-spa
          - demo
        default: 'nebula-spa'
      
      scope:
        description: 'Test scope'
        required: true
        type: choice
        options:
          - all
          - specific
        default: 'all'
      
      test_file:
        description: 'Test file (only if scope=specific, e.g., smoke.yaml)'
        required: false
        type: string
        default: 'smoke.yaml'

# Permissions ที่ต้องมีสำหรับ deploy Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ป้องกัน concurrent deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build ttest
        run: pnpm build

      - name: Determine test path
        id: path
        run: |
          if [ "${{ inputs.scope }}" = "all" ]; then
            TEST_PATH="project-testcase/${{ inputs.project }}/"
            echo "Mode: Run ALL tests in ${{ inputs.project }}/"
          else
            TEST_PATH="project-testcase/${{ inputs.project }}/${{ inputs.test_file }}"
            echo "Mode: Run SPECIFIC test: ${{ inputs.test_file }}"
          fi
          echo "path=$TEST_PATH" >> $GITHUB_OUTPUT
          echo "Selected: $TEST_PATH"

      - name: Validate path
        run: |
          TARGET="${{ steps.path.outputs.path }}"
          if [ ! -e "$TARGET" ]; then
            echo "❌ Path not found: $TARGET"
            echo ""
            echo "Available projects:"
            ls project-testcase | sed 's|^|  - |'
            echo ""
            echo "Available tests:"
            find project-testcase -name "*.yaml" | sed 's|project-testcase/|  - |'
            exit 1
          fi

      - name: Run test(s)
        id: run-test
        run: node dist/cli.js run ${{ steps.path.outputs.path }}
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./report

      - name: Fail workflow if test failed
        if: steps.run-test.outcome == 'failure'
        run: |
          echo "❌ Test(s) failed - see report for details"
          exit 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4