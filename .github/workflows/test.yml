name: ttest E2E

on:
  workflow_dispatch:              # ← กด Run manual บน GitHub UI
  push:
    paths:
      - 'project-testcase/**'
      - 'src/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build ttest
        run: pnpm build

      - name: Run Nebula smoke test
        run: node dist/cli.js run project-testcase/nebula-spa/smoke.yaml