name: "Nebula Spa — landing page smoke"
description: "Verify landing page loads on production"

steps:
  - action: goto
    target: https://nebula-spa.bimav.workers.dev

  - action: wait_for
    locator:
      css: "body"

  # เพิ่มท้าย steps (ก่อน assertions)
  - action: click
    locator:
      role: button
      name: "Non-existent button"
    timeout: 3000

assertions:
  - type: url_matches
    pattern: "nebula-spa"

  - type: visible
    locator:
      css: "body"