name: "Playwright docs — navigation"
description: "Test navigation on Playwright official docs"

steps:
  - action: goto
    target: https://playwright.dev

  - action: wait_for
    locator:
      css: "nav"

  - action: click
    locator:
      role: link
      name: "Get started"

  - action: wait_for
    locator:
      css: "article"

assertions:
  - type: url_matches
    pattern: "intro"

  - type: visible
    locator:
      css: "article"