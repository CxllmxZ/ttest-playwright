name: "Customer A - book Monday 31 Aug 12:00"
description: "First booking attempt for duplicate test - Aug 31 12:00"

steps:
  - action: goto
    target: http://localhost:8787/book

  - action: click
    locator:
      role: button
      name: "นวดไทย ฿ 350 60 นาที"

  - action: click
    locator:
      role: button
      name: "วันจันทร์ที่ 31 สิงหาคม"

  - action: click
    locator:
      role: button
      name: "12:00"

  - action: fill
    locator:
      role: textbox
      name: "ชื่อ-นามสกุล"
    value: "Customer A"

  - action: fill
    locator:
      role: textbox
      name: "เบอร์โทร"
    value: "0811111111"

  - action: click
    locator:
      role: button
      name: "ยืนยันการจอง →"

assertions:
  - type: url_matches
    pattern: "/book/[a-zA-Z0-9]{6}"